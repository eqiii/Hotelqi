<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline - Hotelqi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #1a1208;
            color: #f8f5f0;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            max-width: 500px;
            border: 1px solid #3d2e15;
            padding: 40px;
            border-radius: 16px;
            background: linear-gradient(180deg, #22180b 0%, #1a1208 100%);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #c9a96e 0%, #a87a3a 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            color: white;
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(201, 169, 110, 0.3);
        }
        h1 {
            font-family: 'Playfair Display', serif;
            color: #c9a96e;
            margin: 0 0 16px;
            font-size: 28px;
            letter-spacing: 0.05em;
        }
        p {
            color: #a89f91;
            font-size: 15px;
            line-height: 1.6;
            margin: 0 0 28px;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #c9a96e 0%, #a87a3a 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s;
            cursor: pointer;
        }
        .btn:hover {
            box-shadow: 0 4px 20px rgba(201, 169, 110, 0.4);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">H</div>
        <h1>Anda Sedang Offline</h1>
        <p>Koneksi internet Anda terputus. Silakan periksa jaringan Anda dan coba segarkan halaman ini setelah Anda kembali online.</p>
        <button class="btn" onclick="window.location.reload()">Segarkan Halaman</button>
    </div>
</body>
</html>
